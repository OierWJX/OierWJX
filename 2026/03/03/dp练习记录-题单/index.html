<span class="number">0</span>][<span class="number">0</span>][<span class="number">0</span>][<span class="number">0</span>] = a[<span class="number">1</span>];</span><br><span class="line">	<span class="keyword">for</span> (<span class="type">int</span> i = <span class="number">0</span>;i &lt;= cnt[<span class="number">1</span>];i++)&#123;</span><br><span class="line">		<span class="keyword">for</span> (<span class="type">int</span> j = <span class="number">0</span>;j &lt;= cnt[<span class="number">2</span>];j++)&#123;</span><br><span class="line">			<span class="keyword">for</span> (<span class="type">int</span> k = <span class="number">0</span>;k &lt;= cnt[<span class="number">3</span>];k++)&#123;</span><br><span class="line">				<span class="keyword">for</span> (<span class="type">int</span> s = <span class="number">0</span>;s &lt;= cnt[<span class="number">4</span>];s++)&#123;</span><br><span class="line">					<span class="type">int</span> pos = <span class="number">1</span> + <span class="number">1</span> * i + <span class="number">2</span> * j + <span class="number">3</span> * k + <span class="number">4</span> * s;</span><br><span class="line">					<span class="keyword">if</span> (i != <span class="number">0</span>) dp[i][j][k][s] = <span class="built_in">max</span>(dp[i][j][k][s],dp[i - <span class="number">1</span>][j][k][s] + a[pos]);</span><br><span class="line">					<span class="keyword">if</span> (j != <span class="number">0</span>) dp[i][j][k][s] = <span class="built_in">max</span>(dp[i][j][k][s],dp[i][j - <span class="number">1</span>][k][s] + a[pos]);</span><br><span class="line">					<span class="keyword">if</span> (k != <span class="number">0</span>) dp[i][j][k][s] = <span class="built_in">max</span>(dp[i][j][k][s],dp[i][j][k - <span class="number">1</span>][s] + a[pos]);</span><br><span class="line">					<span class="keyword">if</span> (s != <span class="number">0</span>) dp[i][j][k][s] = <span class="built_in">max</span>(dp[i][j][k][s],dp[i][j][k][s - <span class="number">1</span>] + a[pos]);</span><br><span class="line">				&#125;</span><br><span class="line">			&#125;</span><br><span class="line">		&#125;</span><br><span class="line">	&#125;</span><br><span class="line">	cout &lt;&lt; dp[cnt[<span class="number">1</span>]][cnt[<span class="number">2</span>]][cnt[<span class="number">3</span>]][cnt[<span class="number">4</span>]];</span><br><span class="line">	<span class="keyword">return</span> <span class="number">0</span>;</span><br><span class="line">&#125;</span><br></pre></td></tr></table></figure>
